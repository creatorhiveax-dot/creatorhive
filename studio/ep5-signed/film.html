html,body{margin:0;background:#0A0908}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A0908;font-family:Outfit,'Baloo 2',sans-serif;color:#FAF7F2;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage *{box-sizing:border-box}
.abs{position:absolute}
.hl{font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.55)}
.cream{color:#FAF7F2}.orange{color:#FF6A00}
.blabel{font-weight:600;font-size:27px;color:#A49A91;margin:0 0 10px 20px;letter-spacing:-.01em}
.bubble{display:inline-block;background:#2A2522;border:1.5px solid rgba(255,255,255,.13);border-radius:34px 34px 34px 10px;padding:20px 36px 24px;
  font-weight:800;font-size:46px;line-height:1.12;letter-spacing:-.03em;color:#FAF7F2;white-space:nowrap;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pill{display:inline-block;white-space:nowrap;background:rgba(42,37,34,.92);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;color:#FAF7F2;font-weight:700;letter-spacing:-.01em}
.bcard{display:flex;align-items:center;gap:18px;white-space:nowrap;height:88px;padding:0 32px 0 20px;border-radius:26px;
  background:linear-gradient(180deg,rgba(40,33,29,.96),rgba(22,18,16,.96));border:1.5px solid rgba(255,255,255,.14);
  box-shadow:0 16px 36px rgba(0,0,0,.5);font-weight:700;font-size:40px;letter-spacing:-.025em;color:#FAF7F2}
.tick{flex:none;width:48px;height:48px;border-radius:50%;background:#3DDC84;display:flex;align-items:center;justify-content:center}
.sticker{display:inline-flex;align-items:center;gap:16px;white-space:nowrap;background:#FF6A00;color:#0A0908;border:7px solid #FAF7F2;border-radius:28px;
  padding:10px 26px 12px;font-weight:800;font-size:44px;letter-spacing:-.03em;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.pay{display:inline-flex;align-items:center;gap:24px;white-space:nowrap;background:linear-gradient(180deg,#123222,#0B2217);border:2px solid #2F9C63;border-radius:34px;

.cta{display:inline-block;white-space:nowrap;background:#FF6A00;color:#0A0908;border-radius:999px;padding:22px 46px 26px;font-weight:800;font-size:43px;letter-spacing:-.03em;
